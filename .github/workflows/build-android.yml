name: Costruisci app Android (APK)

# Si avvia da solo a ogni push su main che tocca il gioco, e si puo' lanciare a mano
# dal tab "Actions" del repository (pulsante "Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'src/**'
      - 'vendor/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'android-res/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Capacitor
        run: npm install

      # Raccoglie SOLO i file web del gioco nella cartella "www" (quella che Capacitor
      # impacchetta), senza trascinarsi dietro node_modules, i .md, gli strumenti, ecc.
      # ⚠️ ELENCO ESPLICITO, non "copia tutta assets/". Prima si faceva `cp -r assets www/` e
      # finivano nell'APK anche le IMMAGINI SORGENTE degli sfondi (35 MB!), i fotogrammi grezzi
      # dell'accovacciamento e le protuberanze spente: 23 MB di app di cui ~14 di materiale di
      # lavorazione. Un elenco esplicito e' anche piu' sicuro di una lista di esclusioni: se un
      # file che serve manca, `cp` fallisce e la compilazione si ferma, invece di sfornare
      # un'app rotta in silenzio.
      # ⚠️ QUANDO SI AGGIUNGE UN SET DI SFONDO (window.BG_SETS in BootScene) VA AGGIUNTO ANCHE QUI.
      - name: Assembla la cartella web (www)
        run: |
          rm -rf www
          mkdir -p www/assets/backgrounds www/assets/spritesheets/hero www/assets/spritesheets/enemies
          cp index.html www/
          cp -r vendor src www/
          # assets/wax e bg_flesh_01_px NON si copiano: sono gia' INCORPORATI come data URI in
          # src/assets_data.js (serve per far girare il gioco col doppio clic) e BootScene usa
          # sempre la copia incorporata quando c'e' — i file su disco sarebbero peso doppio.
          cp -r assets/sprites assets/musica www/assets/
          # SFONDI: si copiano i file COTTI di OGNI set, trovandoli invece di elencarli.
          # ⚠️ Prima era scritto a mano il solo set 2. Aggiungendo i set 1 e 3 (2026-08-24) l'app
          # sarebbe partita senza due sfondi su tre — e il difetto non si vede in nessun modo qui:
          # il gioco sul computer li trova, l'APK no. Un elenco a mano di cose che si aggiungono
          # nel tempo e' una trappola che scatta sempre, e sempre in ritardo.
          # Le SORGENTI (fondale.png, mid.png, back.jpg...) restano fuori: servono solo a ricuocere.
          for f in assets/backgrounds/*/bg*_far.jpg assets/backgrounds/*/bg*_mid.png assets/backgrounds/*/bg*_near.png; do
            [ -e "$f" ] || continue
            mkdir -p "www/$(dirname "$f")"
            cp "$f" "www/$f"
          done
          cp assets/spritesheets/hero/*_px.png www/assets/spritesheets/hero/
          cp assets/spritesheets/enemies/*.png www/assets/spritesheets/enemies/
          echo "--- peso della cartella www ---"
          du -sh www www/src www/assets/* | sort -h

      - name: Crea il progetto Android
        run: npx cap add android

      # Stesso Android della versione di rilascio (vedi release-android.yml): se l'APK di prova
      # puntasse a un Android diverso da quello del pacchetto pubblicato, si collauderebbe una
      # cosa e se ne spedirebbe un'altra.
      - name: Punta ad Android 16 (come il pacchetto di rilascio)
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/; s/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle || { echo "targetSdkVersion NON impostato a 36"; exit 1; }

      # L'ICONA. La cartella android/ non e' versionata (la riga sopra la ricrea da zero a ogni
      # compilazione), quindi l'icona non si puo' tenere li' dentro: sta in android-res/, che e'
      # nel repository, e si ricopia qui sopra quella generica di Capacitor.
      # Si rigenera da una sola immagine con:  python tools\fai_icone.py art_sources\icona_waxout.png
      - name: Metti l'icona dell'app
        run: |
          cp -r android-res/. android/app/src/main/res/
          echo "--- icone in posa ---"
          ls android/app/src/main/res/mipmap-xxxhdpi/

      # Stesso trattamento del pacchetto di rilascio (vedi release-android.yml): schermo intero
      # e orientamento fisso. Se l'APK di prova non li avesse, i tester collauderebbero un'app
      # diversa da quella che si pubblica — ed e' proprio da loro che e' arrivata la segnalazione.
      - name: Schermo intero e orizzontale fisso
        run: |
          APP=android/app/src/main/java/io/github/ivocativo/waxout
          cp android-src/MainActivity.java "$APP/MainActivity.java"
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity\n            android:screenOrientation="sensorLandscape"#' "$MAN"
          grep -q 'sensorLandscape' "$MAN" || { echo "ERRORE: orientamento non impostato nel manifest"; exit 1; }

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila l'APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Gradle chiama il file "app-debug.apk" e basta: e' il nome del PROGETTO Android, non del
      # gioco. Sul telefono l'app si chiama gia' Waxout (viene da appName in
      # capacitor.config.json), ma il file scaricato no, e con quel nome non si capisce cos'e'
      # ne' si distinguono due versioni finite nella stessa cartella.
      # Il nome si LEGGE da capacitor.config.json invece di riscriverlo qui: cosi' se un domani
      # l'app cambia nome, il file lo segue da solo.
      - name: Dai all'APK il nome dell'app
        run: |
          NOME=$(node -p "require('./capacitor.config.json').appName")
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NOME.apk"
          ls -lh "$NOME.apk"

      - name: Carica l'APK come risultato scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: waxout-apk
          path: '*.apk'
          if-no-files-found: error
