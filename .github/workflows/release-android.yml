name: Pacchetto per Google Play (AAB firmato)

# ⚠️ SI LANCIA A MANO, dal tab "Actions" del repository (pulsante "Run workflow").
# NON parte da solo a ogni push: e' il pacchetto che si carica sullo store, non quello di prova.
# Il giro di tutti i giorni resta l'altro workflow (build-android.yml), che continua a sfornare
# l'APK di debug con cui si gioca sul telefono.
#
# COSA CAMBIA RISPETTO ALL'APK DI PROVA:
#  1. formato AAB invece di APK — Play non accetta piu' gli APK per le app nuove;
#  2. FIRMATO con la chiave dell'utente (senza firma, Play rifiuta il file);
#  3. il PANNELLO DI PROVA e' spento (se no si pubblicherebbe un gioco con vita infinita);
#  4. ha un numero di versione che cresce da solo (Play rifiuta due caricamenti con lo stesso).
#
# ⚠️ SERVONO QUATTRO SEGRETI nel repository (Settings -> Secrets and variables -> Actions).
# Come si preparano e' scritto in `docs/PUBBLICARE.md`.
#   KEYSTORE_BASE64   la chiave di firma, convertita in testo
#   KEYSTORE_PASSWORD la password dell'archivio
#   KEY_ALIAS         il nome della chiave dentro l'archivio
#   KEY_PASSWORD      la password della chiave
# ⚠️ LA CHIAVE DI FIRMA NON SI PUO' PERDERE NE' CAMBIARE: se si perde, quell'app non si puo' piu'
# aggiornare, mai piu'. Va tenuta in un posto sicuro E in una copia di scorta.

on:
  workflow_dispatch:
    inputs:
      versione:
        description: "Numero di versione mostrato ai giocatori (es. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Capacitor
        run: npm install

      # Stessa cartella web dell'APK di prova: elenco esplicito, non "copia tutta assets/".
      - name: Assembla la cartella web (www)
        # ⚠️ UNA RIGA, e il contenuto sta in tools/assembla_www.sh. Prima l'elenco dei file da
        # impacchettare era copiato in TUTTI E DUE i workflow, e il 2026-08-26 e' successo quello
        # che doveva succedere: aggiornato quello dell'APK di prova, dimenticato quello dell'AAB
        # da pubblicare. Il pacchetto per lo store sarebbe uscito senza le texture del cerume e
        # con un solo sfondo su tre, e nessun controllo poteva accorgersene.
        run: bash tools/assembla_www.sh

      - name: Spegni il pannello di prova
        run: |
          sed -i 's/PANNELLO_PROVA: true/PANNELLO_PROVA: false/' www/src/state.js
          if ! grep -q 'PANNELLO_PROVA: false' www/src/state.js; then
            echo "ERRORE: non sono riuscito a spegnere il pannello di prova in www/src/state.js."
            echo "La riga cercata era 'PANNELLO_PROVA: true'. Se e' cambiata, va aggiornato questo passo."
            exit 1
          fi
          echo "pannello di prova: spento nel pacchetto"
          grep -n 'PANNELLO_PROVA' www/src/state.js

      - name: Crea il progetto Android
        run: npx cap add android

      # ⚠️ A QUALE ANDROID PUNTA L'APP. Google alza questo requisito ogni anno e RIFIUTA il
      # caricamento se non e' rispettato. Storia vera, in due giorni: il 2026-08-09 Play chiedeva
      # 35 (Android 15) contro il 34 di Capacitor 6; il giorno dopo, caricato un pacchetto con 35,
      # ha chiesto **36** (Android 16), perche' la regola e' "non piu' vecchio di un anno rispetto
      # all'ultimo Android uscito" e la scadenza era il 31/08/2026.
      # Lo si scrive qui invece di fidarsi del valore che sceglie Capacitor: cosi' e' una NOSTRA
      # decisione, verificabile, e non cambia sotto i piedi quando si aggiorna una libreria.
      # ⚠️ Quando Google lo rialzera' (succede ogni anno, verso agosto): cambiare il numero QUI e
      # nel controllo del manifest piu' sotto, e rifare girare il workflow. Nient'altro.
      - name: Punta ad Android 16 (richiesto da Google Play)
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/; s/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          cat android/variables.gradle
          # Se la sostituzione non ha preso (Capacitor ha cambiato il formato del file), meglio
          # fermarsi qui che scoprirlo da Play dopo aver caricato.
          grep -q 'targetSdkVersion = 36' android/variables.gradle || { echo "targetSdkVersion NON impostato a 36"; exit 1; }
          grep -q 'compileSdkVersion = 36' android/variables.gradle || { echo "compileSdkVersion NON impostato a 36"; exit 1; }

      - name: Metti l'icona dell'app
        run: cp -r android-res/. android/app/src/main/res/

      # SCHERMO INTERO E ORIZZONTALE FISSO (playtest 2026-08-11, Galaxy A34 / Android 16).
      # Due cose distinte:
      #  - MainActivity.java nostro al posto di quello vuoto di Capacitor: nasconde le barre di
      #    sistema, che da Android 15 vengono disegnate SOPRA il gioco e coprivano il pulsante
      #    di salto (toccandolo si usciva dall'app);
      #  - orientamento bloccato in orizzontale nel manifest: il gioco e' pensato solo cosi',
      #    e da verticale restava una striscia in mezzo allo schermo.
      # ⚠️ Come per l'icona: la cartella android/ si rigenera a ogni compilazione, quindi questi
      # file stanno nel repository e si ricopiano qui, non si modificano "una volta e via".
      - name: Schermo intero e orizzontale fisso
        run: |
          APP=android/app/src/main/java/io/github/ivocativo/waxout
          cp android-src/MainActivity.java "$APP/MainActivity.java"
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity\n            android:screenOrientation="sensorLandscape"#' "$MAN"
          grep -q 'sensorLandscape' "$MAN" || { echo "ERRORE: orientamento non impostato nel manifest"; exit 1; }
          grep -q 'nascondiLeBarre' "$APP/MainActivity.java" || { echo "ERRORE: MainActivity non e' la nostra"; exit 1; }
          echo "schermo intero + orizzontale: ok"

      # Il numero di versione. `versionCode` deve CRESCERE a ogni caricamento su Play, e non si puo'
      # mai riusare: si prende il numero progressivo della compilazione, che cresce da solo e non
      # dipende da nessuno che si ricordi di aggiornarlo. `versionName` e' quello che vedono i
      # giocatori, e lo si scrive lanciando il workflow.
      - name: Numero di versione
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "${{ inputs.versione }}"
              }
          }
          EOF
          echo "versionCode=${{ github.run_number }}  versionName=${{ inputs.versione }}"

      # La chiave arriva dai segreti come testo e qui torna file. Non finisce mai nel repository
      # ne' nei registri della compilazione.
      - name: Rimetti insieme la chiave di firma
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/waxout.keystore"
          ls -l "$RUNNER_TEMP/waxout.keystore"

      - name: Aggiungi la firma al progetto
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  rilascio {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.rilascio
                  }
              }
          }
          EOF

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila il pacchetto (AAB firmato)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/waxout.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      # Non basta aver SCRITTO 36 in variables.gradle: conta cosa e' finito nel pacchetto. Qui si
      # legge il manifest che ha prodotto la compilazione, cioe' lo stesso numero che leggera' Play.
      - name: Verifica a quale Android punta il pacchetto
        run: |
          MAN=$(find android/app/build -name AndroidManifest.xml -path '*merged*' | head -1)
          if [ -z "$MAN" ]; then
            echo "manifest compilato non trovato: controllo saltato (percorso cambiato con la versione di Gradle?)"
          else
            echo "manifest: $MAN"
            grep -o 'targetSdkVersion="[0-9]*"' "$MAN" || true
            grep -q 'targetSdkVersion="36"' "$MAN" \
              || { echo "ERRORE: il pacchetto NON punta ad Android 16, Play lo rifiutera'"; exit 1; }
            echo "punta ad Android 16 (API 36)"
          fi

      # Controllo finale: che il pacchetto sia DAVVERO firmato. Un AAB non firmato viene rifiutato
      # da Play con un messaggio poco chiaro; meglio accorgersene qui.
      - name: Verifica che sia firmato
        run: |
          # ⚠️ PERCORSO ESATTO, NON `find ... | head -1`. Gradle lascia in giro anche gli AAB
          # INTERMEDI, che non sono firmati: il 2026-08-11 il controllo ne ha pescato uno
          # (intermediates/intermediary_bundle/.../intermediary-bundle.aab) e la compilazione si
          # e' fermata dicendo "non risulta firmato" mentre il pacchetto vero era perfetto.
          # Il giorno prima aveva pescato quello giusto — per fortuna, non per costruzione: con
          # un ordine diverso dei file si sarebbe caricato su Play un file di lavorazione.
          # Se un domani Gradle cambiasse questo percorso, meglio fermarsi con l'elenco sotto gli
          # occhi che indovinare quale file prendere.
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "ERRORE: non trovo il pacchetto finale in $AAB. Ecco cosa c'e':"
            find android/app/build/outputs -name "*.aab" || true
            exit 1
          fi
          echo "pacchetto: $AAB"
          unzip -l "$AAB" | grep -qi "META-INF/.*\.RSA\|META-INF/.*\.EC\|META-INF/.*\.DSA" \
            && echo "firma presente" \
            || { echo "ERRORE: il pacchetto non risulta firmato"; exit 1; }
          NOME=$(node -p "require('./capacitor.config.json').appName")
          cp "$AAB" "$NOME-${{ inputs.versione }}.aab"
          ls -lh "$NOME-${{ inputs.versione }}.aab"

      - name: Carica il pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: waxout-play
          path: '*.aab'
          if-no-files-found: error
